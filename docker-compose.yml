services:
  builder:
    build: ./builder
    container_name: ffmg-builder
    restart: unless-stopped
    ports:
      - "8002:8002"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      SITE_ADMIN_TOKEN: ${SITE_ADMIN_TOKEN:-}
      POLSIA_SECRET: ${POLSIA_SECRET:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      GITHUB_PAT: ${GITHUB_PAT:-}
      GITHUB_REPO: ${GITHUB_REPO:-https://github.com/oakc123/website-builder.git}
      PREVIEW_DOMAIN: ${PREVIEW_DOMAIN:-preview.funkfactorymediagroup.com}
      WEBSITE_BUILDS_DIR: /app/website-builds
      INTAKE_JOBS_DIR: /app/intake/jobs
      INTAKE_COSTS_DIR: /app/intake/costs
      INTAKE_LOGS_DIR: /app/intake/logs
      TZ: America/Denver
    volumes:
      - ./intake/jobs:/app/intake/jobs
      - ./intake/costs:/app/intake/costs
      - ./intake/logs:/app/intake/logs
      - ./website-builds:/app/website-builds
      - ./caddy/sites:/srv/sites

  intake:
    build: ./intake
    container_name: ffmg-intake
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      POLSIA_SECRET: ${POLSIA_SECRET:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-http://192.168.0.18:11434}
      TZ: America/Denver
    volumes:
      - ./intake/jobs:/app/jobs
      - ./intake/logs:/app/logs

  caddy:
    image: caddy:2-alpine
    container_name: ffmg-caddy
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile
      - ./caddy/sites:/srv/sites
      - caddy_data:/data
      - caddy_config:/config

  # ── FunkFactoryOS — the live funkfactorymediagroup.com / funkfactorypets.com site ──
  funkfactoryos-db:
    image: postgres:16-alpine
    container_name: ffmg-website-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: funkfactoryos
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${FFMG_POSTGRES_PASSWORD:-postgres}
    volumes:
      - funkfactoryos_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d funkfactoryos"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  funkfactoryos:
    build: ./funkfactoryos
    container_name: ffmg-website
    restart: unless-stopped
    ports:
      - "8003:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://postgres:${FFMG_POSTGRES_PASSWORD:-postgres}@funkfactoryos-db:5432/funkfactoryos?sslmode=disable
      APP_URL: ${FFMG_APP_URL:-https://funkfactorymediagroup.com}
      PORTAL_BASE_URL: ${FFMG_PORTAL_BASE_URL:-https://funkfactorymediagroup.com/portal}
      # ── Auth secrets — unique to this app, set real values in .env ─────────
      ADMIN_PASSWORD: ${FFMG_ADMIN_PASSWORD:-}
      JWT_SECRET: ${FFMG_JWT_SECRET:-}
      ADMIN_JWT_SECRET: ${FFMG_ADMIN_JWT_SECRET:-}
      MAGIC_LINK_SECRET: ${FFMG_MAGIC_LINK_SECRET:-}
      # ── Shared with builder/intake — reuses this repo's existing secrets ───
      ASSISTANT_API_KEY: ${ASSISTANT_API_KEY:-}
      ASSISTANT_BASE_URL: ${ASSISTANT_BASE_URL:-https://builder.funkfactorymediagroup.com}
      INTAKE_WEBHOOK_SECRET: ${POLSIA_SECRET:-}
      # ── Optional integrations — app no-ops these features when unset ───────
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      OWNER_EMAIL: ${OWNER_EMAIL:-}
      AMER_ALERT_EMAIL: ${AMER_ALERT_EMAIL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      POLSIA_API_KEY: ${POLSIA_API_KEY:-}
      POLSIA_R2_BASE_URL: ${POLSIA_R2_BASE_URL:-https://polsia.com}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      KLAVIYO_WEBHOOK_URL: ${KLAVIYO_WEBHOOK_URL:-}
      GA4_MEASUREMENT_ID: ${GA4_MEASUREMENT_ID:-}
      TZ: America/Denver
    volumes:
      - funkfactoryos_uploads:/app/public/uploads
    depends_on:
      funkfactoryos-db:
        condition: service_healthy

volumes:
  caddy_data:
  caddy_config:
  funkfactoryos_postgres_data:
  funkfactoryos_uploads:
