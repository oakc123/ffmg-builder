<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found | Funk Factory Media Group</title>
    <meta name="description" content="The page you're looking for could not be found. Explore Funk Factory Media Group's work, services, and contact options.">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }

        :root {
            --bg-warm: #faf6f1;
            --bg-dark: #1a0f08;
            --text: #1a0f08;
            --text-muted: #6b5c50;
            --accent: #D4956A;
            --accent-dark: #6B3A1F;
        }

        html, body { min-height: 100%; }

        body {
            margin: 0;
            font-family: 'DM Sans', sans-serif;
            background: var(--bg-dark);
            color: var(--text);
            line-height: 1.6;
        }

        .page-shell {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            background:
                radial-gradient(circle at 85% 16%, rgba(212,149,106,0.14), transparent 32%),
                var(--bg-dark);
        }

        header {
            width: 100%;
            padding: 24px 40px;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .header-inner {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
        }

        .logo-link {
            display: inline-flex;
            align-items: center;
            border-radius: 4px;
        }

        .logo-link img { display: block; width: auto; height: 48px; }

        nav {
            display: flex;
            align-items: center;
            gap: 28px;
        }

        nav a {
            color: rgba(255,255,255,0.68);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: color 0.2s;
        }

        nav a:hover { color: var(--accent); }

        main {
            flex: 1;
            display: flex;
            align-items: center;
            width: 100%;
            padding: 96px 40px 112px;
        }

        .not-found {
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            display: grid;
            grid-template-columns: minmax(0, 1.1fr) minmax(280px, 0.9fr);
            align-items: center;
            gap: 80px;
        }

        .eyebrow {
            margin-bottom: 22px;
            color: var(--accent);
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.78rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        h1 {
            max-width: 680px;
            margin: 0 0 24px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(3.2rem, 8vw, 7rem);
            font-weight: 800;
            letter-spacing: -4px;
            line-height: 0.95;
        }

        h1 span { color: var(--accent); }

        .message {
            max-width: 520px;
            margin: 0 0 36px;
            color: rgba(255,255,255,0.62);
            font-size: 1.08rem;
            line-height: 1.75;
        }

        .actions {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
        }

        .action-link {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 14px 22px;
            border: 1px solid rgba(212,149,106,0.38);
            border-radius: 6px;
            color: #fff;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            text-decoration: none;
            transition: background 0.2s, border-color 0.2s, transform 0.2s;
        }

        .action-link.primary {
            border-color: var(--accent);
            background: var(--accent);
        }

        .action-link:hover,
        .action-link.primary:hover {
            border-color: var(--accent-dark);
            background: var(--accent-dark);
            transform: translateY(-2px);
        }

        .mark {
            position: relative;
            min-height: 320px;
            display: grid;
            place-items: center;
            border: 1px solid rgba(212,149,106,0.24);
            background: var(--bg-warm);
            overflow: hidden;
        }

        .mark::before,
        .mark::after {
            position: absolute;
            content: '';
            border: 1px solid rgba(107,58,31,0.18);
            border-radius: 50%;
        }

        .mark::before { width: 280px; height: 280px; }
        .mark::after { width: 210px; height: 210px; }

        .mark-number {
            position: relative;
            z-index: 1;
            color: var(--accent-dark);
            font-family: 'Space Grotesk', sans-serif;
            font-size: clamp(5rem, 12vw, 9rem);
            font-weight: 800;
            letter-spacing: -8px;
            line-height: 1;
        }

        :focus-visible {
            outline: 3px solid var(--accent);
            outline-offset: 5px;
        }

        footer {
            padding: 0 40px 28px;
            color: rgba(255,255,255,0.32);
            font-size: 0.8rem;
            text-align: center;
        }

        @media (max-width: 760px) {
            header { padding: 20px 24px; }
            .logo-link img { height: 42px; }
            nav { gap: 16px; }
            nav a { font-size: 0.8rem; }
            main { padding: 68px 24px 80px; }
            .not-found { grid-template-columns: 1fr; gap: 48px; }
            .mark { min-height: 220px; order: -1; }
            .mark::before { width: 200px; height: 200px; }
            .mark::after { width: 150px; height: 150px; }
            h1 { letter-spacing: -2.5px; }
            footer { padding: 0 24px 24px; }
        }

        @media (max-width: 420px) {
            .header-inner { align-items: flex-start; }
            .logo-link img { height: 36px; }
            nav { gap: 11px; }
            nav a { font-size: 0.74rem; }
            .actions { flex-direction: column; align-items: stretch; }
            .action-link { justify-content: center; }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header>
            <div class="header-inner">
                <a class="logo-link" href="/" aria-label="Funk Factory Media Group home">
                    <img src="/images/ffmg-logo.svg" alt="Funk Factory Media Group">
                </a>
                <nav aria-label="Primary navigation">
                    <a href="/">Home</a>
                    <a href="/work">Work</a>
                    <a href="/contact">Contact</a>
                </nav>
            </div>
        </header>

        <main>
            <section class="not-found" aria-labelledby="not-found-title">
                <div>
                    <div class="eyebrow">FFMG · 404</div>
                    <h1 id="not-found-title">Page <span>not found.</span></h1>
                    <p class="message">This frame is missing from the reel. Let’s get you back to the work, the home base, or a conversation about your next project.</p>
                    <div class="actions" aria-label="Helpful links">
                        <a class="action-link primary" href="/">Back home <span aria-hidden="true">→</span></a>
                        <a class="action-link" href="/work">See the work <span aria-hidden="true">→</span></a>
                        <a class="action-link" href="/contact">Start a project <span aria-hidden="true">→</span></a>
                    </div>
                </div>
                <div class="mark" aria-hidden="true">
                    <div class="mark-number">404</div>
                </div>
            </section>
        </main>

        <footer>Funk Factory Media Group · New Mexico sports &amp; live event media</footer>
    </div>
</body>
</html>
