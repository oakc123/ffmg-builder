<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FFMG Admin — Gallery Manager</title>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700;800&family=DM+Sans:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #0f0f0f;
            --bg-card: #1a1a1a;
            --bg-hover: #222222;
            --border: rgba(255,255,255,0.08);
            --border-strong: rgba(255,255,255,0.15);
            --text: #ffffff;
            --text-muted: rgba(255,255,255,0.45);
            --accent: #e84d1a;
            --accent-dark: #c03a10;
            --success: #22c55e;
            --error: #ef4444;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: 'DM Sans', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
        }

        /* ── LOGIN ── */
        #loginScreen {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .login-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 48px 40px;
            width: 100%;
            max-width: 420px;
        }

        .login-logo {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 8px;
        }

        .login-logo span { color: var(--accent); }

        .login-sub {
            font-size: 0.88rem;
            color: var(--text-muted);
            margin-bottom: 36px;
        }

        .login-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .login-input {
            width: 100%;
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 14px 16px;
            font-size: 0.95rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .login-input:focus { border-color: var(--accent); }

        .login-btn {
            width: 100%;
            margin-top: 20px;
            padding: 14px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
        }

        .login-btn:hover { background: var(--accent-dark); }
        .login-btn:disabled { opacity: 0.5; cursor: not-allowed; }

        .login-error {
            display: none;
            margin-top: 12px;
            padding: 10px 14px;
            background: rgba(239,68,68,0.12);
            border: 1px solid rgba(239,68,68,0.3);
            border-radius: 6px;
            font-size: 0.85rem;
            color: #fca5a5;
        }

        /* ── ADMIN PANEL ── */
        #adminPanel { display: none; }

        .admin-header {
            position: sticky;
            top: 0;
            z-index: 50;
            background: rgba(15,15,15,0.95);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 0 32px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .admin-brand {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .admin-brand span { color: var(--accent); }

        .admin-header-right {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        .header-badge {
            font-size: 0.78rem;
            color: var(--text-muted);
        }

        .logout-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.82rem;
            font-family: 'DM Sans', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }

        .logout-btn:hover { color: var(--text); border-color: var(--border-strong); }

        .admin-main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 32px 32px 64px;
        }

        /* ── UPLOAD ZONE ── */
        .upload-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            margin-bottom: 32px;
        }

        .section-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title-icon {
            width: 32px;
            height: 32px;
            background: rgba(232,77,26,0.12);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
        }

        .drop-zone {
            border: 2px dashed var(--border-strong);
            border-radius: 12px;
            padding: 40px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .drop-zone.dragover {
            border-color: var(--accent);
            background: rgba(232,77,26,0.06);
        }

        .drop-zone input[type="file"] {
            position: absolute;
            inset: 0;
            opacity: 0;
            cursor: pointer;
        }

        .drop-icon { font-size: 2.5rem; margin-bottom: 12px; }

        .drop-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 6px;
        }

        .drop-sub {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .upload-meta {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 16px;
            margin-top: 20px;
        }

        .meta-label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            margin-bottom: 8px;
        }

        .meta-input,
        .meta-select {
            width: 100%;
            background: rgba(255,255,255,0.04);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 11px 14px;
            font-size: 0.9rem;
            color: var(--text);
            font-family: 'DM Sans', sans-serif;
            outline: none;
            transition: border-color 0.2s;
        }

        .meta-input:focus,
        .meta-select:focus { border-color: var(--accent); }

        .meta-select option { background: #1a1a1a; }

        .upload-btn {
            margin-top: 20px;
            padding: 13px 28px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .upload-btn:hover { background: var(--accent-dark); }
        .upload-btn:disabled { opacity: 0.4; cursor: not-allowed; }

        /* Progress queue */
        #uploadQueue {
            margin-top: 20px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .queue-item {
            background: rgba(255,255,255,0.03);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .queue-thumb {
            width: 48px;
            height: 48px;
            border-radius: 6px;
            object-fit: cover;
            flex-shrink: 0;
            background: var(--bg-hover);
        }

        .queue-info { flex: 1; min-width: 0; }

        .queue-name {
            font-size: 0.85rem;
            font-weight: 500;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-bottom: 4px;
        }

        .queue-progress-bar {
            height: 3px;
            background: var(--border-strong);
            border-radius: 2px;
            overflow: hidden;
        }

        .queue-progress-fill {
            height: 100%;
            background: var(--accent);
            transition: width 0.3s;
        }

        .queue-status {
            font-size: 0.78rem;
            color: var(--text-muted);
            flex-shrink: 0;
        }

        .queue-status.done { color: var(--success); }
        .queue-status.error { color: var(--error); }

        /* ── GALLERY MANAGER ── */
        .gallery-section {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
        }

        .gallery-section-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 16px;
        }

        .cat-tabs {
            display: flex;
            gap: 6px;
            flex-wrap: wrap;
        }

        .cat-tab {
            padding: 6px 16px;
            border-radius: 100px;
            border: 1px solid var(--border);
            background: transparent;
            font-size: 0.82rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'DM Sans', sans-serif;
            color: var(--text-muted);
        }

        .cat-tab:hover { border-color: var(--border-strong); color: var(--text); }
        .cat-tab.active { background: var(--accent); color: #fff; border-color: var(--accent); }

        .photo-count {
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .gallery-grid-admin {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 12px;
        }

        .photo-card {
            position: relative;
            border-radius: 10px;
            overflow: hidden;
            aspect-ratio: 4/3;
            background: var(--bg-hover);
            cursor: grab;
            border: 1px solid var(--border);
            transition: border-color 0.2s;
        }

        .photo-card:hover { border-color: var(--border-strong); }
        .photo-card.drag-over { border-color: var(--accent); }

        .photo-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .photo-card-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            opacity: 0;
            transition: opacity 0.2s;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 10px;
        }

        .photo-card:hover .photo-card-overlay { opacity: 1; }

        .photo-card-top {
            display: flex;
            justify-content: flex-end;
        }

        .photo-delete-btn {
            background: rgba(239,68,68,0.9);
            color: #fff;
            border: none;
            border-radius: 6px;
            padding: 5px 8px;
            font-size: 0.78rem;
            cursor: pointer;
            font-family: 'DM Sans', sans-serif;
            transition: background 0.2s;
        }

        .photo-delete-btn:hover { background: #dc2626; }

        .photo-card-bottom {}

        .photo-cat-badge {
            display: inline-block;
            padding: 2px 8px;
            border-radius: 100px;
            font-size: 0.7rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            background: rgba(232,77,26,0.85);
            color: #fff;
            margin-bottom: 4px;
        }

        .photo-caption {
            font-size: 0.78rem;
            color: rgba(255,255,255,0.8);
            line-height: 1.3;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Edit modal */
        .modal-backdrop {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.7);
            z-index: 200;
            justify-content: center;
            align-items: center;
            padding: 24px;
        }

        .modal-backdrop.open { display: flex; }

        .modal-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 32px;
            width: 100%;
            max-width: 400px;
        }

        .modal-title {
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.1rem;
            font-weight: 700;
            margin-bottom: 24px;
        }

        .modal-thumb {
            width: 100%;
            aspect-ratio: 16/9;
            object-fit: cover;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        .modal-btns {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .modal-save-btn {
            flex: 1;
            padding: 11px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
        }

        .modal-cancel-btn {
            padding: 11px 20px;
            background: transparent;
            color: var(--text-muted);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-family: 'DM Sans', sans-serif;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* Empty state */
        .empty-state {
            text-align: center;
            padding: 48px 24px;
            color: var(--text-muted);
        }

        .empty-state-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .empty-state-text { font-size: 0.9rem; }

        /* Toast */
        #toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            padding: 12px 20px;
            border-radius: 8px;
            font-size: 0.88rem;
            font-weight: 500;
            z-index: 999;
            transform: translateY(80px);
            opacity: 0;
            transition: all 0.3s ease;
            pointer-events: none;
        }

        #toast.show {
            transform: translateY(0);
            opacity: 1;
        }

        #toast.success {
            background: rgba(34,197,94,0.15);
            border: 1px solid rgba(34,197,94,0.3);
            color: #86efac;
        }

        #toast.error {
            background: rgba(239,68,68,0.15);
            border: 1px solid rgba(239,68,68,0.3);
            color: #fca5a5;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .admin-main { padding: 20px 16px 48px; }
            .upload-meta { grid-template-columns: 1fr; }
            .gallery-grid-admin { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
            .admin-header { padding: 0 16px; }
        }
    </style>
</head>
<body>

<!-- LOGIN SCREEN -->
<div id="loginScreen">
    <div class="login-card">
        <div class="login-logo">Funk<span>Factory</span> MG</div>
        <div class="login-sub">Gallery Admin Panel</div>
        <label class="login-label" for="adminPassword">Password</label>
        <input type="password" id="adminPassword" class="login-input" placeholder="Enter admin password" autocomplete="current-password">
        <button class="login-btn" id="loginBtn" onclick="doLogin()">Sign In →</button>
        <div id="loginError" class="login-error">Wrong password. Try again.</div>
    </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">

    <header class="admin-header">
        <div class="admin-brand">Funk<span>Factory</span> MG <span style="color:var(--text-muted);font-weight:400;font-size:0.85rem;font-family:'DM Sans',sans-serif;margin-left:8px;">Gallery Admin</span></div>
        <div class="admin-header-right">
            <span class="header-badge" id="photoCountBadge">0 photos</span>
            <button class="logout-btn" onclick="doLogout()">Logout</button>
        </div>
    </header>

    <main class="admin-main">

        <!-- UPLOAD ZONE -->
        <div class="upload-section">
            <div class="section-title">
                <div class="section-title-icon">📸</div>
                Upload Photos
            </div>

            <div class="drop-zone" id="dropZone">
                <input type="file" id="fileInput" accept="image/*" multiple>
                <div class="drop-icon">🖼️</div>
                <div class="drop-title">Drag & drop photos here</div>
                <div class="drop-sub">or click to browse · JPEG, PNG, WEBP · Auto-compressed to 2000px / 80% quality</div>
            </div>

            <div class="upload-meta">
                <div>
                    <label class="meta-label" for="uploadCategory">Category</label>
                    <select id="uploadCategory" class="meta-select">
                        <option value="football">Football</option>
                        <option value="basketball">Basketball</option>
                        <option value="sports" selected>Sports</option>
                        <option value="concerts">Concerts</option>
                    </select>
                </div>
                <div>
                    <label class="meta-label" for="uploadCaption">Caption (optional)</label>
                    <input type="text" id="uploadCaption" class="meta-input" placeholder="e.g. Varsity Football 2025">
                </div>
                <div style="display:flex;align-items:flex-end;">
                    <button class="upload-btn" id="uploadBtn" onclick="startUpload()" disabled>
                        ↑ Upload Photos
                    </button>
                </div>
            </div>

            <div id="uploadQueue"></div>
        </div>

        <!-- GALLERY MANAGER -->
        <div class="gallery-section">
            <div class="gallery-section-header">
                <div class="section-title" style="margin-bottom:0">
                    <div class="section-title-icon">🗂️</div>
                    Manage Gallery
                </div>
                <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;">
                    <div class="cat-tabs">
                        <button class="cat-tab active" data-cat="all" onclick="filterGallery('all', this)">All</button>
                        <button class="cat-tab" data-cat="football" onclick="filterGallery('football', this)">Football</button>
                        <button class="cat-tab" data-cat="basketball" onclick="filterGallery('basketball', this)">Basketball</button>
                        <button class="cat-tab" data-cat="sports" onclick="filterGallery('sports', this)">Sports</button>
                        <button class="cat-tab" data-cat="concerts" onclick="filterGallery('concerts', this)">Concerts</button>
                    </div>
                    <span class="photo-count" id="galleryCount">Loading...</span>
                </div>
            </div>

            <div class="gallery-grid-admin" id="adminGalleryGrid"></div>
        </div>

    </main>
</div>

<!-- EDIT MODAL -->
<div class="modal-backdrop" id="editModal">
    <div class="modal-card">
        <div class="modal-title">Edit Photo</div>
        <img class="modal-thumb" id="modalThumb" src="" alt="">
        <div>
            <label class="meta-label" for="modalCaption">Caption</label>
            <input type="text" id="modalCaption" class="meta-input" placeholder="e.g. Game Day Coverage">
        </div>
        <div style="margin-top:14px;">
            <label class="meta-label" for="modalCategory">Category</label>
            <select id="modalCategory" class="meta-select">
                <option value="football">Football</option>
                <option value="basketball">Basketball</option>
                <option value="sports">Sports</option>
                <option value="concerts">Concerts</option>
            </select>
        </div>
        <div class="modal-btns">
            <button class="modal-cancel-btn" onclick="closeEditModal()">Cancel</button>
            <button class="modal-save-btn" onclick="saveEdit()">Save Changes</button>
        </div>
    </div>
</div>

<!-- TOAST -->
<div id="toast"></div>

<script>
// ─── State ───────────────────────────────────────────────────
let pendingFiles = [];
let allPhotos = [];
let currentFilter = 'all';
let editingPhotoId = null;

// ─── Auth ────────────────────────────────────────────────────

async function checkAuth() {
    try {
        const res = await fetch('/api/admin/check');
        const data = await res.json();
        if (data.authenticated) showPanel();
    } catch (e) {}
}

async function doLogin() {
    const pw = document.getElementById('adminPassword').value;
    const btn = document.getElementById('loginBtn');
    const errEl = document.getElementById('loginError');

    if (!pw) return;
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    errEl.style.display = 'none';

    try {
        const res = await fetch('/api/admin/login', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ password: pw })
        });

        if (res.ok) {
            showPanel();
        } else {
            errEl.style.display = 'block';
            btn.disabled = false;
            btn.textContent = 'Sign In →';
        }
    } catch (e) {
        errEl.textContent = 'Connection error. Please try again.';
        errEl.style.display = 'block';
        btn.disabled = false;
        btn.textContent = 'Sign In →';
    }
}

async function doLogout() {
    await fetch('/api/admin/logout', { method: 'POST' });
    document.getElementById('adminPanel').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('adminPassword').value = '';
    document.getElementById('loginBtn').disabled = false;
    document.getElementById('loginBtn').textContent = 'Sign In →';
}

function showPanel() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display = 'block';
    loadGallery();
}

// Enter key for login
document.getElementById('adminPassword').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') doLogin();
});

// ─── File picking + compression ──────────────────────────────

const dropZone = document.getElementById('dropZone');
const fileInput = document.getElementById('fileInput');
const uploadQueue = document.getElementById('uploadQueue');

dropZone.addEventListener('dragover', (e) => {
    e.preventDefault();
    dropZone.classList.add('dragover');
});
dropZone.addEventListener('dragleave', () => dropZone.classList.remove('dragover'));
dropZone.addEventListener('drop', (e) => {
    e.preventDefault();
    dropZone.classList.remove('dragover');
    handleFiles(Array.from(e.dataTransfer.files));
});

fileInput.addEventListener('change', (e) => {
    handleFiles(Array.from(e.target.files));
    e.target.value = '';
});

function handleFiles(files) {
    const images = files.filter(f => f.type.startsWith('image/'));
    if (!images.length) return;
    pendingFiles = pendingFiles.concat(images);
    renderQueue();
    document.getElementById('uploadBtn').disabled = false;
}

function renderQueue() {
    uploadQueue.innerHTML = '';
    pendingFiles.forEach((f, i) => {
        const item = document.createElement('div');
        item.className = 'queue-item';
        item.id = `queue-${i}`;

        const url = URL.createObjectURL(f);
        item.innerHTML = `
            <img class="queue-thumb" src="${url}" alt="">
            <div class="queue-info">
                <div class="queue-name">${f.name}</div>
                <div class="queue-progress-bar"><div class="queue-progress-fill" style="width:0%" id="prog-${i}"></div></div>
            </div>
            <div class="queue-status" id="status-${i}">Pending</div>
        `;
        uploadQueue.appendChild(item);
    });
}

// ─── Canvas compress ─────────────────────────────────────────

function compressImage(file, maxPx = 2000, quality = 0.8) {
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = (e) => {
            const img = new Image();
            img.onload = () => {
                let { width, height } = img;
                if (width > maxPx || height > maxPx) {
                    if (width > height) { height = Math.round(height * maxPx / width); width = maxPx; }
                    else { width = Math.round(width * maxPx / height); height = maxPx; }
                }
                const canvas = document.createElement('canvas');
                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);
                canvas.toBlob((blob) => {
                    if (!blob) return reject(new Error('Compression failed'));
                    resolve(blob);
                }, 'image/jpeg', quality);
            };
            img.onerror = reject;
            img.src = e.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
    });
}

// ─── Upload ──────────────────────────────────────────────────

async function startUpload() {
    if (!pendingFiles.length) return;

    const btn = document.getElementById('uploadBtn');
    btn.disabled = true;

    const category = document.getElementById('uploadCategory').value;
    const caption = document.getElementById('uploadCaption').value;

    for (let i = 0; i < pendingFiles.length; i++) {
        const file = pendingFiles[i];
        const progEl = document.getElementById(`prog-${i}`);
        const statusEl = document.getElementById(`status-${i}`);

        statusEl.textContent = 'Compressing…';
        progEl.style.width = '20%';

        try {
            const blob = await compressImage(file);
            progEl.style.width = '40%';
            statusEl.textContent = 'Uploading…';

            // Upload to server
            const formData = new FormData();
            formData.append('photo', blob, `photo_${Date.now()}.jpg`);

            const uploadRes = await fetch('/api/admin/upload', {
                method: 'POST',
                body: formData
            });

            progEl.style.width = '80%';

            if (!uploadRes.ok) {
                const err = await uploadRes.json();
                throw new Error(err.message || 'Upload failed');
            }

            const { url } = await uploadRes.json();

            // Save to gallery
            const saveRes = await fetch('/api/admin/gallery', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url, caption, category })
            });

            if (!saveRes.ok) throw new Error('Failed to save photo');

            progEl.style.width = '100%';
            statusEl.className = 'queue-status done';
            statusEl.textContent = '✓ Done';

        } catch (err) {
            statusEl.className = 'queue-status error';
            statusEl.textContent = '✗ ' + err.message;
            progEl.style.width = '100%';
            progEl.style.background = 'var(--error)';
        }
    }

    // Reload gallery
    await loadGallery();

    // Clear queue after 2s
    setTimeout(() => {
        pendingFiles = [];
        uploadQueue.innerHTML = '';
        document.getElementById('uploadCaption').value = '';
        btn.disabled = false;
    }, 2000);

    toast('Photos uploaded!', 'success');
}

// ─── Gallery ─────────────────────────────────────────────────

async function loadGallery() {
    try {
        const res = await fetch('/api/gallery');
        const data = await res.json();
        if (data.success) {
            allPhotos = data.photos;
            renderGallery();
            updateCounts();
        }
    } catch (e) {
        console.error('Failed to load gallery', e);
    }
}

function renderGallery() {
    const grid = document.getElementById('adminGalleryGrid');
    const filtered = currentFilter === 'all'
        ? allPhotos
        : allPhotos.filter(p => p.category === currentFilter);

    document.getElementById('galleryCount').textContent = `${filtered.length} photo${filtered.length !== 1 ? 's' : ''}`;

    if (!filtered.length) {
        grid.innerHTML = `
            <div class="empty-state" style="grid-column:1/-1">
                <div class="empty-state-icon">📷</div>
                <div class="empty-state-text">No photos yet in this category. Upload some above!</div>
            </div>`;
        return;
    }

    grid.innerHTML = filtered.map(p => `
        <div class="photo-card" data-id="${p.id}" onclick="openEditModal(${p.id})">
            <img src="${p.url}" alt="${p.caption || ''}" loading="lazy" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=\\'http://www.w3.org/2000/svg\\' width=\\'200\\' height=\\'150\\'><rect width=\\'200\\' height=\\'150\\' fill=\\'%23333\\'/><text x=\\'50%\\' y=\\'50%\\' fill=\\'%23666\\' text-anchor=\\'middle\\' dy=\\'.3em\\' font-size=\\'14\\'>No preview</text></svg>'">
            <div class="photo-card-overlay">
                <div class="photo-card-top">
                    <button class="photo-delete-btn" onclick="deletePhoto(event, ${p.id})">Delete</button>
                </div>
                <div class="photo-card-bottom">
                    <span class="photo-cat-badge">${p.category}</span>
                    ${p.caption ? `<div class="photo-caption">${p.caption}</div>` : ''}
                </div>
            </div>
        </div>
    `).join('');
}

function updateCounts() {
    document.getElementById('photoCountBadge').textContent = `${allPhotos.length} photo${allPhotos.length !== 1 ? 's' : ''}`;
}

function filterGallery(cat, btn) {
    currentFilter = cat;
    document.querySelectorAll('.cat-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderGallery();
}

async function deletePhoto(e, id) {
    e.stopPropagation();
    if (!confirm('Delete this photo from the gallery?')) return;

    try {
        const res = await fetch(`/api/admin/gallery/${id}`, { method: 'DELETE' });
        if (res.ok) {
            allPhotos = allPhotos.filter(p => p.id !== id);
            renderGallery();
            updateCounts();
            toast('Photo deleted', 'success');
        } else {
            toast('Failed to delete', 'error');
        }
    } catch (e) {
        toast('Connection error', 'error');
    }
}

// ─── Edit Modal ──────────────────────────────────────────────

function openEditModal(id) {
    const photo = allPhotos.find(p => p.id === id);
    if (!photo) return;

    editingPhotoId = id;
    document.getElementById('modalThumb').src = photo.url;
    document.getElementById('modalCaption').value = photo.caption || '';
    document.getElementById('modalCategory').value = photo.category;
    document.getElementById('editModal').classList.add('open');
    document.body.style.overflow = 'hidden';
}

function closeEditModal() {
    document.getElementById('editModal').classList.remove('open');
    document.body.style.overflow = '';
    editingPhotoId = null;
}

async function saveEdit() {
    if (!editingPhotoId) return;

    const caption = document.getElementById('modalCaption').value;
    const category = document.getElementById('modalCategory').value;

    try {
        const res = await fetch(`/api/admin/gallery/${editingPhotoId}`, {
            method: 'PATCH',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ caption, category })
        });

        if (res.ok) {
            const { photo } = await res.json();
            allPhotos = allPhotos.map(p => p.id === editingPhotoId ? photo : p);
            renderGallery();
            closeEditModal();
            toast('Photo updated!', 'success');
        } else {
            toast('Save failed', 'error');
        }
    } catch (e) {
        toast('Connection error', 'error');
    }
}

// Close modal on backdrop click
document.getElementById('editModal').addEventListener('click', (e) => {
    if (e.target === e.currentTarget) closeEditModal();
});
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeEditModal(); });

// ─── Toast ───────────────────────────────────────────────────

let toastTimer;
function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = `show ${type}`;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => el.classList.remove('show'), 3000);
}

// ─── Init ────────────────────────────────────────────────────
checkAuth();
</script>
