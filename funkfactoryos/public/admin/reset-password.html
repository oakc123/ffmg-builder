<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFMG Admin — New Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f3ef;
      --surface: #ffffff;
      --border: #e8e0d8;
      --text: #1a1209;
      --text-muted: #7a6e62;
      --copper: #D4956A;
      --brown: #6B3A1F;
      --error: #dc2626;
      --success: #16a34a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(107,58,31,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: var(--brown);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg { width: 24px; height: 24px; }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      line-height: 1;
    }

    .logo-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    .error-banner {
      display: none;
      font-size: 13px;
      color: var(--error);
      background: #fef2f2;
      border: 1px solid #fecaca;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .error-banner.visible { display: block; }

    .success-banner {
      display: none;
      font-size: 14px;
      color: var(--success);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .success-banner.visible { display: block; }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--copper); }

    .field { margin-bottom: 16px; }

    .field-error {
      display: none;
      font-size: 12px;
      color: var(--error);
      margin-top: 6px;
    }
    .field-error.visible { display: block; }

    .field-error-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: var(--brown);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 8px;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:hover { background: #5a3018; }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { background: #b0a090; cursor: not-allowed; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--copper); text-decoration: underline; }

    .requirements {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 4px;
    }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h10v4H8v3h5v4H8v5H4V4z" fill="#D4956A"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">FFMG Admin</div>
      <div class="logo-sub">Funk Factory Media Group</div>
    </div>
  </div>

  <h1>New Password</h1>
  <p class="subtitle">Choose a new password for your admin account.</p>

  <div class="error-banner" id="errorBanner">This link is invalid or has expired. Please request a new one.</div>
  <div class="success-banner" id="successBanner">Password updated! Redirecting to login…</div>

  <form id="resetForm">
    <div class="field">
      <label for="password">New password</label>
      <input type="password" id="password" name="password" placeholder="Min. 8 characters" autocomplete="new-password">
      <div class="field-error" id="passwordError">Password must be at least 8 characters</div>
    </div>

    <div class="field">
      <label for="confirm">Confirm password</label>
      <input type="password" id="confirm" name="confirm" placeholder="Repeat password" autocomplete="new-password">
      <div class="field-error" id="confirmError">Passwords do not match</div>
    </div>

    <button type="submit" id="submitBtn">Update Password</button>
  </form>

  <a href="/admin/login" class="back-link">Back to sign in</a>
</div>

<script>
  // Check for token in URL immediately
  (function() {
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    if (!token) {
      document.getElementById('errorBanner').classList.add('visible');
      document.getElementById('resetForm').style.display = 'none';
    }
  })();

  document.getElementById('resetForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const params = new URLSearchParams(window.location.search);
    const token = params.get('token');
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const btn = document.getElementById('submitBtn');
    const errBanner = document.getElementById('errorBanner');
    const successBanner = document.getElementById('successBanner');
    const pwdErr = document.getElementById('passwordError');
    const confirmErr = document.getElementById('confirmError');

    errBanner.classList.remove('visible');
    successBanner.classList.remove('visible');
    pwdErr.classList.remove('visible');
    confirmErr.classList.remove('visible');

    // Validation
    if (password.length < 8) {
      pwdErr.classList.add('visible');
      return;
    }
    if (password !== confirm) {
      confirmErr.classList.add('visible');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Updating…';

    try {
      const res = await fetch('/api/admin/reset-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password })
      });

      const data = await res.json();

      if (res.ok && data.success) {
        successBanner.classList.add('visible');
        btn.textContent = 'Updated!';
        document.getElementById('password').disabled = true;
        document.getElementById('confirm').disabled = true;
        btn.disabled = true;
        setTimeout(() => { window.location.href = '/admin/login?reset=success'; }, 2000);
      } else {
        errBanner.textContent = data.message || 'Failed to reset password. The link may have expired.';
        errBanner.classList.add('visible');
        btn.disabled = false;
        btn.textContent = 'Update Password';
      }
    } catch {
      errBanner.textContent = 'Network error — try again.';
      errBanner.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Update Password';
    }
  });
</script>
</body>
</html>
