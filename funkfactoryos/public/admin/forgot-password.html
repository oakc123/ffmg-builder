<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FFMG Admin — Forgot Password</title>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #f7f3ef;
      --surface: #ffffff;
      --border: #e8e0d8;
      --text: #1a1209;
      --text-muted: #7a6e62;
      --copper: #D4956A;
      --copper-dark: #b97a52;
      --brown: #6B3A1F;
      --error: #dc2626;
      --success: #16a34a;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--bg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      box-shadow: 0 4px 24px rgba(107,58,31,0.08);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 32px;
    }

    .logo-mark {
      width: 40px;
      height: 40px;
      background: var(--brown);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .logo-mark svg { width: 24px; height: 24px; }

    .logo-text {
      font-family: 'Space Grotesk', sans-serif;
      font-weight: 700;
      font-size: 18px;
      color: var(--text);
      line-height: 1;
    }

    .logo-sub {
      font-size: 12px;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 2px;
    }

    h1 {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
    }

    .subtitle {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 28px;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text);
      margin-bottom: 6px;
    }

    input[type="email"], input[type="password"] {
      width: 100%;
      padding: 12px 16px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-family: 'DM Sans', sans-serif;
      font-size: 15px;
      color: var(--text);
      background: var(--bg);
      outline: none;
      transition: border-color 0.15s;
    }

    input:focus { border-color: var(--copper); }

    .error-msg {
      display: none;
      font-size: 13px;
      color: var(--error);
      margin-top: 8px;
    }
    .error-msg.visible { display: block; }

    .success-msg {
      display: none;
      font-size: 14px;
      color: var(--success);
      background: #f0fdf4;
      border: 1px solid #bbf7d0;
      border-radius: 8px;
      padding: 12px 16px;
      margin-bottom: 16px;
    }
    .success-msg.visible { display: block; }

    button[type="submit"] {
      width: 100%;
      padding: 13px;
      background: var(--brown);
      color: white;
      border: none;
      border-radius: 10px;
      font-family: 'Space Grotesk', sans-serif;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 20px;
      transition: background 0.15s, transform 0.1s;
    }

    button[type="submit"]:hover { background: #5a3018; }
    button[type="submit"]:active { transform: scale(0.99); }
    button[type="submit"]:disabled { background: #b0a090; cursor: not-allowed; }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 16px;
      font-size: 13px;
      color: var(--text-muted);
      text-decoration: none;
    }
    .back-link:hover { color: var(--copper); text-decoration: underline; }

    .field { margin-bottom: 0; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="logo-mark">
      <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M4 4h10v4H8v3h5v4H8v5H4V4z" fill="#D4956A"/>
      </svg>
    </div>
    <div>
      <div class="logo-text">FFMG Admin</div>
      <div class="logo-sub">Funk Factory Media Group</div>
    </div>
  </div>

  <h1>Reset Password</h1>
  <p class="subtitle">Enter the email associated with your admin account. We'll send you a reset link.</p>

  <div class="success-msg" id="successMsg">
    If an account matches that email, you'll receive a reset link within a few minutes.
  </div>

  <form id="forgotForm">
    <div class="field" style="margin-bottom: 16px;">
      <label for="email">Email address</label>
      <input type="email" id="email" name="email" placeholder="admin@funkfactorymediagroup.com" autocomplete="email" autofocus>
      <div class="error-msg" id="errorMsg">Something went wrong. Please try again.</div>
    </div>
    <button type="submit" id="submitBtn">Send Reset Link</button>
  </form>

  <a href="/admin/login" class="back-link">Back to sign in</a>
</div>

<script>
  document.getElementById('forgotForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn = document.getElementById('submitBtn');
    const errMsg = document.getElementById('errorMsg');
    const successMsg = document.getElementById('successMsg');
    const email = document.getElementById('email').value.trim();

    errMsg.classList.remove('visible');
    successMsg.classList.remove('visible');
    btn.disabled = true;
    btn.textContent = 'Sending…';

    if (!email) {
      errMsg.textContent = 'Please enter your email address.';
      errMsg.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
      return;
    }

    try {
      const res = await fetch('/api/admin/forgot-password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });

      // Always show the same success message — don't reveal whether email exists
      successMsg.classList.add('visible');
      btn.textContent = 'Link sent!';
      document.getElementById('email').disabled = true;

    } catch {
      errMsg.textContent = 'Network error — try again.';
      errMsg.classList.add('visible');
      btn.disabled = false;
      btn.textContent = 'Send Reset Link';
    }
  });
</script>
</body>
</html>
